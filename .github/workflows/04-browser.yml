# GitHub Actions workflow to browse a given URL, take a screenshot, download linked media files,
# and save the page HTML, links, and assets into a structured folder under pages/.
# Uses Puppeteer (headless Chrome) for screenshot and curl for asset downloading.
# Triggered manually via workflow_dispatch with a URL input.

name: 🌐 4-Browse the Web

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to visit'
        required: true
        type: string

jobs:
  browse:
    runs-on: ubuntu-latest
    # Need write permission to create folders, save files, and commit changes
    permissions:
      contents: write
    steps:
      # Step 1: Checkout repository so we can add new files under pages/ and update browse.md
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Install system dependencies: curl (downloading), zip (archiving)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip

      # Step 3: Set up Node.js environment and install Puppeteer (headless browser)
      - name: Setup Node and Puppeteer
        run: |
          npm init -y                # Create package.json with defaults
          npm install puppeteer      # Install Puppeteer for screenshot capture

      # Step 4: Create a Node.js script that takes a screenshot using Puppeteer
      - name: Create screenshot script
        run: |
          cat > screenshot.js << 'ENDOFSCRIPT'
          const puppeteer = require('puppeteer');
          const url = process.argv[2];
          const outputPath = process.argv[3];

          (async () => {
            // Launch headless Chrome with sandbox disabled (required for GitHub Actions environment)
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });
            
            try {
              // Navigate to URL, wait for network to become idle (up to 30 sec)
              await page.goto(url, { waitUntil: 'networkidle2', timeout: 30000 });
              await page.screenshot({ path: outputPath, fullPage: true });
              console.log('Screenshot saved successfully');
            } catch (err) {
              console.error('Screenshot error:', err.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          ENDOFSCRIPT

      # Step 5: Visit the URL, download HTML, extract links, download media files, generate index.md and update browse.md
      - name: Visit URL and download media
        run: |
          RAW_URL="${{ github.event.inputs.url }}"
          
          # Normalize URL: add https:// if no protocol given, and test connectivity
          if [[ ! "$RAW_URL" =~ ^https?:// ]]; then
            HTTPS_URL="https://$RAW_URL"
            HTTP_URL="http://$RAW_URL"
            
            echo "Trying HTTPS: $HTTPS_URL"
            # Check if HTTPS responds with a successful status (2xx or 3xx)
            if curl -L --connect-timeout 10 --max-time 30 -o /dev/null -s -w "%{http_code}" "$HTTPS_URL" | grep -q "200\|301\|302\|303\|307\|308"; then
              URL="$HTTPS_URL"
              echo "HTTPS works, using $URL"
            else
              echo "HTTPS failed, falling back to HTTP"
              URL="$HTTP_URL"
            fi
          else
            URL="$RAW_URL"
          fi
          
          echo "Visiting $URL"

          # Extract domain (remove protocol and optional www) to use as directory name
          DOMAIN=$(echo "$URL" | awk -F/ '{print $3}' | sed 's/^www\.//')
          
          # Create a URL slug by replacing non-alphanumeric characters with underscores (max 100 chars)
          SLUG=$(echo "$URL" | sed 's/[^a-zA-Z0-9]/_/g' | cut -c1-100)
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FOLDER="pages/$DOMAIN/$SLUG/$TIMESTAMP"
          MEDIA_FOLDER="$FOLDER/media"
          mkdir -p "$FOLDER" "$MEDIA_FOLDER"

          # Download the HTML source of the page (using generic user-agent)
          echo "Downloading page HTML..."
          curl -L -A "Mozilla/5.0" -o "$FOLDER/page.html" "$URL"

          # Take a screenshot using Puppeteer script
          echo "Taking screenshot..."
          node screenshot.js "$URL" "$FOLDER/screenshot.png" && SCREENSHOT_OK=true || SCREENSHOT_OK=false

          # Extract all href and src links from the HTML (basic pattern matching)
          grep -oP 'href="\K[^"]*' "$FOLDER/page.html" | sort -u > "$FOLDER/all_links.txt"
          grep -oP 'src="\K[^"]*' "$FOLDER/page.html" | sort -u >> "$FOLDER/all_links.txt"
          sort -u "$FOLDER/all_links.txt" -o "$FOLDER/all_links.txt"   # remove duplicates

          # Define media extensions we want to download (images, audio, video, documents, archives)
          MEDIA_EXT="png|jpg|jpeg|gif|svg|webp|bmp|ico|mp3|wav|ogg|flac|aac|mp4|webm|avi|mov|mkv|pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar|tar|gz|7z"

          # Prepare files to separate media links from other links
          > "$FOLDER/media_links.txt"
          > "$FOLDER/other_links.txt"
          > "$FOLDER/downloaded_media.md"
          echo "## Downloaded Media Files" > "$FOLDER/downloaded_media.md"
          echo "" >> "$FOLDER/downloaded_media.md"

          # Base URL for resolving relative links (scheme + domain)
          BASE_URL="${URL%%/*}"            # e.g., https://example.com
          BASE_DOMAIN=$(echo "$URL" | awk -F/ '{print $3}')

          # Process each link from the extracted list
          while IFS= read -r link; do
            [ -z "$link" ] && continue
            
            # Resolve relative links to absolute URLs
            if [[ "$link" = /* ]]; then
              ABSOLUTE_URL="${BASE_URL}${link}"
            elif [[ "$link" =~ ^https?:// ]]; then
              ABSOLUTE_URL="$link"
            else
              ABSOLUTE_URL="${BASE_URL}/${link}"
            fi

            # Extract file extension (case-insensitive)
            ext="${link##*.}"
            ext_lower=$(echo "$ext" | tr '[:upper:]' '[:lower:]')

            # Check if the link points to a media file based on extension
            if echo "$ext_lower" | grep -Eq "^($MEDIA_EXT)$"; then
              echo "Downloading: $ABSOLUTE_URL"
              # Clean filename: remove query parameters and fragments
              FILENAME=$(basename "$link" | sed 's/[?#].*//')
              # Avoid overwriting by prefixing with timestamp if file already exists
              [ -f "$MEDIA_FOLDER/$FILENAME" ] && FILENAME="$(date +%s)_$FILENAME"
              
              # Attempt to download the media file with curl (fail silently if error)
              curl -L --retry 2 --max-time 60 -o "$MEDIA_FOLDER/$FILENAME" "$ABSOLUTE_URL" 2>/dev/null && {
                FILE_SIZE=$(stat -c%s "$MEDIA_FOLDER/$FILENAME" 2>/dev/null || echo 0)
                if [ "$FILE_SIZE" -gt 0 ]; then
                  echo "$link" >> "$FOLDER/media_links.txt"
                  # If it's an image, embed markdown image tag; otherwise list as link with size
                  if [[ "$ext_lower" =~ ^(png|jpg|jpeg|gif|svg|webp)$ ]]; then
                    echo "![$FILENAME](./media/$FILENAME)" >> "$FOLDER/downloaded_media.md"
                  else
                    echo "- [$FILENAME](./media/$FILENAME) ($(( FILE_SIZE / 1024 )) KB)" >> "$FOLDER/downloaded_media.md"
                  fi
                  echo "OK: $FILENAME"
                fi
              } || echo "Failed: $ABSOLUTE_URL"
            else
              # Non-media link: add to other_links.txt for reference
              echo "$link" >> "$FOLDER/other_links.txt"
            fi
          done < "$FOLDER/all_links.txt"

          # Build an index.md file summarizing the browsing results
          MEDIA_COUNT=$(find "$MEDIA_FOLDER" -type f 2>/dev/null | wc -l)
          {
            echo "# Visited: $URL"
            echo "**Time:** $(date)"
            echo ""
            if [ "$SCREENSHOT_OK" = true ] && [ -f "$FOLDER/screenshot.png" ]; then
              echo "## Screenshot"
              echo "![Screenshot](./screenshot.png)"
              echo ""
            fi
            echo "## Raw HTML"
            echo "[page.html](./page.html)"
            echo ""
            echo "## Downloaded Media ($MEDIA_COUNT files)"
            if [ "$MEDIA_COUNT" -gt 0 ]; then
              cat "$FOLDER/downloaded_media.md"
            else
              echo "_No media files downloaded_"
            fi
            echo ""
            echo "## Other Links"
            if [ -s "$FOLDER/other_links.txt" ]; then
              # Show only first 50 other links to keep output manageable
              head -50 "$FOLDER/other_links.txt" | while read -r link; do
                echo "- [$link]($link)"
              done
            fi
            echo ""
            echo "## Stats"
            echo "- Links: $(wc -l < "$FOLDER/all_links.txt")"
            echo "- Media: $MEDIA_COUNT"
          } > "$FOLDER/index.md"

          # Update the global browse.md file (list of all browsed websites) with a link to this visit
          BROWSE_FILE="browse.md"
          if [ ! -f "$BROWSE_FILE" ]; then
            echo "# Browsed Websites" > "$BROWSE_FILE"
            echo "" >> "$BROWSE_FILE"
          fi
          # Append a new entry with relative path to the index.md file
          echo "- [${SLUG} (${TIMESTAMP})]($FOLDER/index.md) — $MEDIA_COUNT media files" >> "$BROWSE_FILE"

          # Save variables for later steps (zip and commit)
          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV
          echo "SLUG=$SLUG" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

          echo "Done: $MEDIA_COUNT files downloaded"

      # Step 6: Create a zip archive of the timestamp folder (for easy download of all assets)
      - name: Create zip archive of the timestamp folder
        run: |
          # Navigate to the timestamp's parent directory (pages/domain/slug/)
          cd pages/$DOMAIN/$SLUG
          # Zip the timestamp folder into a zip file placed in the same directory
          zip -r "$TIMESTAMP.zip" "$TIMESTAMP"
          cd ../../..

      # Step 7: Commit all changes (pages/, browse.md) and push to repository
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pages/ browse.md
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Saved page with media and screenshot [skip ci]"
          # Rebase to avoid conflicts and then push
          git pull --rebase
          git push
